name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require JavaScript runtime for dashboard regressions
        run: node --version
      - name: Run complete validation and regression suite
        # Consumer checkout: source-ledger validation reports missing private
        # transcripts as SKIP; committed ledger checks still run.
        run: python3 scripts/check.py
