<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI Audit Annotator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#111214;--panel:#1a1c1f;--line:#2a2d31;--txt:#e8e8e6;--dim:#8b8f95;--acc:#ff5b04}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:20px}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
  h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  h1 b{color:var(--acc)}
  .hint{color:var(--dim);font-size:12px}
  #wrap{display:flex;gap:16px;align-items:flex-start}
  #stage{position:relative;flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);min-height:340px;
         display:flex;align-items:center;justify-content:center;cursor:crosshair;user-select:none}
  #stage.empty::after{content:"paste a screenshot (⌘V), drop an image, or click / press Enter to browse";color:var(--dim)}
  #stage:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
  .box.active{border-style:dashed}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  #img{display:block;max-width:100%;height:auto;pointer-events:none}
  .box{position:absolute;border:2px solid var(--acc);background:rgba(255,91,4,.10)}
  .box .tag{position:absolute;top:-22px;left:-2px;background:var(--acc);color:#111;font-weight:700;
            font-size:11px;padding:1px 7px;white-space:nowrap}
  #side{width:320px;flex:none}
  #list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .row{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 8px}
  .row b{color:var(--acc);width:20px;flex:none}
  .row input{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--txt);
             font:inherit;outline:none;padding:2px 0}
  .row input:focus{border-bottom-color:var(--acc)}
  .row button{background:none;border:none;color:var(--dim);cursor:pointer;font:inherit}
  .row button:hover{color:#f66}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .btns button{background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;
               padding:8px 12px;cursor:pointer}
  .btns button:hover{border-color:var(--acc);color:var(--acc)}
  #out{margin-top:12px;width:100%;height:150px;background:var(--panel);border:1px solid var(--line);
       color:var(--dim);font:11px/1.5 inherit;padding:8px;white-space:pre;overflow:auto}
button:disabled{opacity:.45;cursor:not-allowed}
  #feedback{margin-top:12px;color:var(--dim)}
  @media(max-width:720px){body{padding:12px}header{flex-wrap:wrap}#wrap{flex-direction:column}#stage,#side{width:100%}#stage{flex:auto;min-height:240px}.box .tag{max-width:85vw;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<header><h1><b>UI</b> audit annotator</h1>
<span class="hint">drag or press B to box an element · label it · export JSON/PNG · attach either to the audit</span></header>
<div id="wrap">
  <div id="stage" class="empty" tabindex="0" role="application"
       aria-label="Annotation stage. Press Enter to browse for an image. With an image loaded: B adds a box, arrow keys move it, Shift plus arrows resize it, Enter labels it, Delete removes it."><img id="img" hidden alt=""></div>
  <div id="side">
    <div id="list"></div>
    <div class="btns">
      <button id="png">download annotated png</button>
      <button id="json">copy json</button>
      <button id="md">copy markdown</button>
      <button id="clear">clear boxes</button>
    </div>
    <p id="feedback" role="status"></p>
    <textarea id="out" aria-label="Annotation export" readonly placeholder="export appears here (also copied to clipboard)"></textarea>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<span id="live" class="sr" role="status"></span>
<script>
const stage=document.getElementById('stage'),img=document.getElementById('img'),
      list=document.getElementById('list'),out=document.getElementById('out');
let boxes=[],imgName='screenshot',loading=false,loadVersion=0;
const clamp=(n,max)=>Math.max(0,Math.min(max,n));
function feedback(t){document.getElementById('feedback').textContent=t;}
function controls(){['png','json','md'].forEach(id=>document.getElementById(id).disabled=loading||img.hidden);document.getElementById('clear').disabled=loading||!boxes.length;}
function loadBlob(b,name){
  if(!b||!b.type.startsWith('image/')){feedback('Choose an image file.');return;}
  const version=++loadVersion,url=URL.createObjectURL(b),candidate=new Image();
  loading=true;drag=null;controls();feedback('Loading image…');
  candidate.onload=()=>{
    if(version!==loadVersion){URL.revokeObjectURL(url);return;}
    img.onload=()=>{
      URL.revokeObjectURL(url);img.onload=null;img.onerror=null;
      if(version!==loadVersion)return;
      img.hidden=false;stage.classList.remove('empty');
      imgName=(name||'screenshot').replace(/\.[^.]+$/,'');boxes=[];active=-1;loading=false;out.value='';
      render();feedback('Image loaded. Drag or press B to add a box.');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);img.onload=null;img.onerror=null;if(version!==loadVersion)return;loading=false;img.hidden=true;stage.classList.add('empty');boxes=[];active=-1;render();feedback('This image could not be displayed. Choose another image.');};
    img.src=url;
  };
  candidate.onerror=()=>{URL.revokeObjectURL(url);if(version!==loadVersion)return;loading=false;controls();feedback('This image could not be loaded. Choose another image.');};
  candidate.src=url;
}
addEventListener('paste',e=>{const f=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
  if(f)loadBlob(f.getAsFile(),'pasted');});
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadBlob(f,f.name);});
stage.addEventListener('click',e=>{if(img.hidden)document.getElementById('file').click();});
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f)loadBlob(f,f.name);e.target.value='';};

let drag=null;
stage.addEventListener('mousedown',e=>{if(img.hidden||loading||e.button!==0||e.target.closest('.box'))return;
  const r=img.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
  drag={x0:clamp(e.clientX-r.left,r.width),y0:clamp(e.clientY-r.top,r.height),r};e.preventDefault();});
addEventListener('mousemove',e=>{if(!drag)return;
  drag.x1=clamp(e.clientX-drag.r.left,drag.r.width);drag.y1=clamp(e.clientY-drag.r.top,drag.r.height);render(drag);});
addEventListener('mouseup',e=>{if(!drag)return;
  const d=drag;drag=null;if(d.x1==null)return;
  const x=Math.min(d.x0,d.x1),y=Math.min(d.y0,d.y1),w=Math.abs(d.x1-d.x0),h=Math.abs(d.y1-d.y0);
  if(w>8&&h>8){boxes.push({label:'',x:x/d.r.width,y:y/d.r.height,w:w/d.r.width,h:h/d.r.height});active=boxes.length-1;}
  render();focusLast();});

// Keyboard authoring path (WCAG 2.1.1): everything drag can do, keys can do.
let active=-1;
const say=t=>{document.getElementById('live').textContent=t;};
stage.addEventListener('keydown',e=>{
  if(loading)return;
  if(img.hidden){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById('file').click();}
    return;
  }
  const k=e.key;
  if(k==='b'||k==='B'){
    boxes.push({label:'',x:.4,y:.4,w:.2,h:.2});active=boxes.length-1;render();
    say('Box '+boxes.length+' added at center. Arrows move, Shift+arrows resize, Enter labels, Delete removes.');
    e.preventDefault();return;
  }
  if(active<0||!boxes[active])return;
  const b=boxes[active],s=.02;
  if(k==='ArrowLeft'){if(e.shiftKey)b.w=Math.max(s,b.w-s);else b.x=Math.max(0,b.x-s);}
  else if(k==='ArrowRight'){if(e.shiftKey)b.w=Math.min(1-b.x,b.w+s);else b.x=Math.min(1-b.w,b.x+s);}
  else if(k==='ArrowUp'){if(e.shiftKey)b.h=Math.max(s,b.h-s);else b.y=Math.max(0,b.y-s);}
  else if(k==='ArrowDown'){if(e.shiftKey)b.h=Math.min(1-b.y,b.h+s);else b.y=Math.min(1-b.h,b.y+s);}
  else if(k==='Enter'){render();focusIdx(active);say('Label box '+(active+1));e.preventDefault();return;}
  else if(k==='Delete'||k==='Backspace'){boxes.splice(active,1);active=-1;render();say('Box removed.');e.preventDefault();return;}
  else if(k==='Escape'){active=-1;render();return;}
  else return;
  e.preventDefault();render();
});

function render(live){
  stage.querySelectorAll('.box').forEach(b=>b.remove());
  controls();list.replaceChildren();
  if(img.hidden)return;
  const r=img.getBoundingClientRect(),off={x:img.offsetLeft,y:img.offsetTop};
  const draw=(x,y,w,h,n,label,isActive)=>{const d=document.createElement('div');
    d.className='box'+(isActive?' active':'');
    Object.assign(d.style,{left:off.x+x+'px',top:off.y+y+'px',width:w+'px',height:h+'px'});
    const tag=document.createElement('span');tag.className='tag';tag.textContent=n+(label?' · '+label:'');d.appendChild(tag);stage.appendChild(d);};
  boxes.forEach((b,i)=>draw(b.x*r.width,b.y*r.height,b.w*r.width,b.h*r.height,i+1,b.label,i===active));
  if(live&&live.x1!=null)draw(Math.min(live.x0,live.x1),Math.min(live.y0,live.y1),
    Math.abs(live.x1-live.x0),Math.abs(live.y1-live.y0),boxes.length+1,'');
  list.replaceChildren();
  boxes.forEach((b,i)=>{const row=document.createElement('div');row.className='row';
    const number=document.createElement('b');number.textContent=i+1;
    const input=document.createElement('input');input.placeholder="what is this / what's wrong";input.value=b.label;input.setAttribute('aria-label','Label box '+(i+1));
    const remove=document.createElement('button');remove.textContent='✕';remove.setAttribute('aria-label','Remove box '+(i+1));
    row.append(number,input,remove);
    row.querySelector('input').oninput=e=>{b.label=e.target.value;
      stage.querySelectorAll('.tag')[i].textContent=(i+1)+(b.label?' · '+b.label:'');};
    row.querySelector('button').onclick=()=>{boxes.splice(i,1);active=Math.min(active,boxes.length-1);render();};
    list.appendChild(row);});
}
function focusLast(){const ins=list.querySelectorAll('input');if(ins.length)ins[ins.length-1].focus();}
function focusIdx(i){const ins=list.querySelectorAll('input');if(ins[i])ins[i].focus();}

function payload(){const W=img.naturalWidth,H=img.naturalHeight;
  return {image:imgName,width:W,height:H,elements:boxes.map((b,i)=>({n:i+1,label:b.label,
    x:Math.round(b.x*W),y:Math.round(b.y*H),w:Math.round(b.w*W),h:Math.round(b.h*H),
    pct:{x:+(b.x*100).toFixed(1),y:+(b.y*100).toFixed(1),w:+(b.w*100).toFixed(1),h:+(b.h*100).toFixed(1)}}))};}
async function show(t){out.value=t;try{if(!navigator.clipboard?.writeText)throw new Error('unavailable');await navigator.clipboard.writeText(t);feedback('Copied to clipboard.');}catch{feedback('Clipboard unavailable. Select and copy the export below.');out.focus();out.select();}}
document.getElementById('json').onclick=()=>show(JSON.stringify(payload(),null,2));
document.getElementById('md').onclick=()=>{const p=payload();
  show(`Screenshot: ${p.image} (${p.width}×${p.height})\n`+p.elements.map(e=>
   `${e.n}. [${e.pct.x}%,${e.pct.y}% ${e.pct.w}×${e.pct.h}%] ${e.label||'(unlabeled)'}`).join('\n'));};
document.getElementById('clear').onclick=()=>{boxes=[];active=-1;out.value='';render();feedback('Boxes cleared.');};
document.getElementById('png').onclick=()=>{if(img.hidden)return;
  const c=document.createElement('canvas'),W=img.naturalWidth,H=img.naturalHeight;
  c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(img,0,0);
  const s=Math.max(2,W/500);g.lineWidth=s;g.strokeStyle='#ff5b04';g.font=`bold ${s*7}px monospace`;
  boxes.forEach((b,i)=>{const x=b.x*W,y=b.y*H,w=b.w*W,h=b.h*H;
    g.strokeRect(x,y,w,h);const t=` ${i+1}${b.label?' · '+b.label:''} `,tw=g.measureText(t).width;
    g.fillStyle='#ff5b04';g.fillRect(x-s,y-s*9,tw,s*9);g.fillStyle='#111';g.fillText(t,x-s,y-s*2.4);});
  const a=document.createElement('a');a.download=imgName+'-annotated.png';a.href=c.toDataURL();a.click();};
addEventListener('resize',()=>render());
controls();
</script>
</body>
</html>
